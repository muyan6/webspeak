services:
  webspeak:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WEBSPEAK_IMAGE:-webspeak:latest}
    restart: unless-stopped
    # WebSpeak needs to reach a TeamSpeak server running on the same host.
    # Host networking also exposes the configured WebRTC UDP range directly.
    network_mode: host
    environment:
      - PORT=${PORT:-3040}
    volumes:
      - webspeak-data:/data

volumes:
  webspeak-data:
