# WebSpeak — Docker Compose
# 一键部署 / 更新：docker compose pull && docker compose up -d

services:
  webspeak:
    image: ${WEBSPEAK_IMAGE:-ghcr.1ms.run/muyan6/webspeak:latest}
    container_name: webspeak
    restart: unless-stopped
    # WebSpeak needs to reach a TeamSpeak server running on the same host.
    # Host networking also exposes the configured WebRTC UDP range directly.
    network_mode: host
    environment:
      - PORT=${PORT:-3040}
    volumes:
      - webspeak-data:/data

volumes:
  webspeak-data:
